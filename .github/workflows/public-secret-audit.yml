name: Public Git history secret audit
on:
  pull_request:
    paths:
      - scripts/public_secret_audit.py
      - tests/test_public_secret_audit.py
      - .github/workflows/public-secret-audit.yml
  workflow_dispatch:
  schedule:
    - cron: "13 7 * * *"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test the scanner including deleted-secret history
        run: python -m unittest discover -s tests -p test_public_secret_audit.py -v
      - name: Scan all original public GitHub repositories, branches, tags, and PR heads
        if: github.event_name != 'pull_request'
        run: python scripts/public_secret_audit.py --owner jonah-ux
