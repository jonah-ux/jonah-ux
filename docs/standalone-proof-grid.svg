<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Fifteen standalone AI developer tools</title>
  <desc id="desc">A dark grid of independent projects with the same install, demo, inspect rhythm.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#15152f"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#77ddc2"/><stop offset="1" stop-color="#a7a5ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="1100" cy="36" r="120" fill="#77ddc2" opacity=".09" filter="url(#glow)"/>
  <circle cx="92" cy="500" r="150" fill="#a7a5ff" opacity=".08" filter="url(#glow)"/>
  <text x="54" y="66" fill="#77ddc2" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="700" letter-spacing="3">JONAH-UX / STANDALONE PROOF GRID</text>
  <text x="54" y="112" fill="#edf5ff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800">Install one. Run one. Understand one.</text>
  <text x="54" y="140" fill="#9eb4cc" font-family="Inter,Arial,sans-serif" font-size="16">Every repo earns its own first impression before the suite connections begin.</text>
  <g font-family="Inter,Arial,sans-serif" font-size="16" font-weight="750">
    <g transform="translate(54 182)"><rect width="210" height="84" rx="14" fill="#102b3b" stroke="#77ddc2" stroke-opacity=".55"/><text x="18" y="33" fill="#edf5ff">Forgeyard</text><text x="18" y="59" fill="#77ddc2" font-size="12">seal → tamper → refuse</text></g>
    <g transform="translate(280 182)"><rect width="210" height="84" rx="14" fill="#171d42" stroke="#a7a5ff" stroke-opacity=".55"/><text x="18" y="33" fill="#edf5ff">Atlas</text><text x="18" y="59" fill="#a7a5ff" font-size="12">pause → recover → receipt</text></g>
    <g transform="translate(506 182)"><rect width="210" height="84" rx="14" fill="#102b3b" stroke="#77ddc2" stroke-opacity=".55"/><text x="18" y="33" fill="#edf5ff">Chatlens</text><text x="18" y="59" fill="#77ddc2" font-size="12">find → card → continue</text></g>
    <g transform="translate(732 182)"><rect width="210" height="84" rx="14" fill="#171d42" stroke="#a7a5ff" stroke-opacity=".55"/><text x="18" y="33" fill="#edf5ff">Agent Proof</text><text x="18" y="59" fill="#a7a5ff" font-size="12">bind → graph → verify</text></g>
    <g transform="translate(958 182)"><rect width="188" height="84" rx="14" fill="#102b3b" stroke="#77ddc2" stroke-opacity=".55"/><text x="18" y="33" fill="#edf5ff">Sourcemark</text><text x="18" y="59" fill="#77ddc2" font-size="12">anchor → move → prove</text></g>
    <g transform="translate(54 290)"><rect width="210" height="84" rx="14" fill="#171d42" stroke="#a7a5ff" stroke-opacity=".55"/><text x="18" y="33" fill="#edf5ff">Context Integrity</text><text x="18" y="59" fill="#a7a5ff" font-size="12">scope → freshness → admit</text></g>
    <g transform="translate(280 290)"><rect width="210" height="84" rx="14" fill="#102b3b" stroke="#77ddc2" stroke-opacity=".55"/><text x="18" y="33" fill="#edf5ff">Slipstream</text><text x="18" y="59" fill="#77ddc2" font-size="12">build → query → inspect</text></g>
    <g transform="translate(506 290)"><rect width="210" height="84" rx="14" fill="#171d42" stroke="#a7a5ff" stroke-opacity=".55"/><text x="18" y="33" fill="#edf5ff">Worktree Conservator</text><text x="18" y="59" fill="#a7a5ff" font-size="12">plan → preserve → restore</text></g>
    <g transform="translate(732 290)"><rect width="210" height="84" rx="14" fill="#102b3b" stroke="#77ddc2" stroke-opacity=".55"/><text x="18" y="33" fill="#edf5ff">Agent Eval Kit</text><text x="18" y="59" fill="#77ddc2" font-size="12">run → compare → score</text></g>
    <g transform="translate(958 290)"><rect width="188" height="84" rx="14" fill="#171d42" stroke="#a7a5ff" stroke-opacity=".55"/><text x="18" y="33" fill="#edf5ff">Context Pack</text><text x="18" y="59" fill="#a7a5ff" font-size="12">select → bound → hash</text></g>
    <g transform="translate(54 398)"><rect width="210" height="84" rx="14" fill="#102b3b" stroke="#77ddc2" stroke-opacity=".55"/><text x="18" y="33" fill="#edf5ff">Agent Trace Lite</text><text x="18" y="59" fill="#77ddc2" font-size="12">redact → view → filter</text></g>
    <g transform="translate(280 398)"><rect width="210" height="84" rx="14" fill="#171d42" stroke="#a7a5ff" stroke-opacity=".55"/><text x="18" y="33" fill="#edf5ff">Agent Policy</text><text x="18" y="59" fill="#a7a5ff" font-size="12">match → explain → deny</text></g>
    <g transform="translate(506 398)"><rect width="210" height="84" rx="14" fill="#102b3b" stroke="#77ddc2" stroke-opacity=".55"/><text x="18" y="33" fill="#edf5ff">Agent Sandbox Run</text><text x="18" y="59" fill="#77ddc2" font-size="12">run → record → bound</text></g>
    <g transform="translate(732 398)"><rect width="210" height="84" rx="14" fill="#171d42" stroke="#a7a5ff" stroke-opacity=".55"/><text x="18" y="33" fill="#edf5ff">Agent Resume</text><text x="18" y="59" fill="#a7a5ff" font-size="12">break → diff → continue</text></g>
    <g transform="translate(958 398)"><rect width="188" height="84" rx="14" fill="#102b3b" stroke="#77ddc2" stroke-opacity=".55"/><text x="18" y="33" fill="#edf5ff">MCP Doctor</text><text x="18" y="59" fill="#77ddc2" font-size="12">lint → drift → refuse</text></g>
  </g>
  <text x="54" y="525" fill="#8ea7c1" font-family="ui-monospace,Menlo,monospace" font-size="11" letter-spacing="1.5">OPTIONAL SUITE CONNECTIONS COME AFTER THE STANDALONE PROOF</text>
</svg>
