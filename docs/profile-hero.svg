<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jonah Helland — AI developer tooling</title>
  <desc id="desc">A dark terminal-style banner for open-source tools that make AI coding agents easier to inspect, evaluate, and recover.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#101827"/><stop offset="0.55" stop-color="#172A46"/><stop offset="1" stop-color="#3A1F4D"/></linearGradient>
    <linearGradient id="glow" x1="110" y1="70" x2="1080" y2="245" gradientUnits="userSpaceOnUse"><stop stop-color="#6EE7F9"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="1060" cy="18" r="190" fill="#8B5CF6" fill-opacity="0.13"/><circle cx="1120" cy="274" r="160" fill="#22D3EE" fill-opacity="0.10"/>
  <path d="M0 244C180 172 280 292 465 225C650 158 747 241 910 171C1020 124 1102 128 1200 90" stroke="url(#glow)" stroke-opacity="0.28" stroke-width="2"/>
  <g filter="url(#shadow)"><rect x="78" y="56" width="1044" height="190" rx="16" fill="#0B1220" fill-opacity="0.78" stroke="#FFFFFF" stroke-opacity="0.12"/><circle cx="110" cy="84" r="6" fill="#FB7185"/><circle cx="130" cy="84" r="6" fill="#FBBF24"/><circle cx="150" cy="84" r="6" fill="#34D399"/></g>
  <text x="106" y="132" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">$ whoami</text>
  <text x="106" y="174" fill="white" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="700">Jonah Helland</text>
  <text x="106" y="210" fill="#A5F3FC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">AI developer tooling · agent workflows · open-source CLIs</text>
  <text x="106" y="235" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">inspect  →  evaluate  →  prove  →  recover</text>
</svg>
